name: libranet-complete

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libranet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libranet}
      POSTGRES_DB: ${POSTGRES_DB:-libranet}
    ports:
      - "5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libranet"]
      interval: 5s
      retries: 20


  redis:
    image: redis:7-alpine
    ports:
      - "6479:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20


  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-libranet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-libranet-secret-change-me}
    ports:
      - "9102:9000"
      - "9103:9001"
    volumes:
      - miniodata:/data


  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "9100:1025"
      - "9101:8025"


  chroma:
    image: chromadb/chroma:0.6.3
    environment:
      ANONYMIZED_TELEMETRY: "False"
    ports:
      - "8101:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    environment:
      CHROMA_URL: http://chroma:8000
      SBERT_MODEL: sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8100:8000"
    volumes:
      - sbert-cache:/root/.cache/torch/sentence_transformers
    depends_on:
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s


  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ai-service:
        condition: service_started
      chroma:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: staging

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-libranet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-libranet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}

      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

      SPRING_DATA_REDIS_HOST: redis

      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-libranet-media}

      MAIL_HOST: mailpit
      MAIL_PORT: 1025

      AI_SERVICE_URL: http://ai-service:8000
      CHROMA_URL: http://chroma:8000

    ports:
      - "8180:8080"


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://backend:8080
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:
  pgdata:
    name: libranet-complete_pgdata

  redisdata:
    name: libranet-complete_redisdata

  miniodata:
    name: libranet-complete_miniodata

  chromadata:
    name: libranet-complete_chromadata

  sbert-cache:
    name: libranet-complete_sbert-cache