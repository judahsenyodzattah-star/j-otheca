name: jotheca-complete

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jotheca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jotheca}
      POSTGRES_DB: ${POSTGRES_DB:-jotheca}
      # Phase A least-privilege runtime roles. Secrets from .env/secret manager; defaults are DEV ONLY
      # (mirror the POSTGRES_PASSWORD:-jotheca pattern) — override in staging/prod. No secret in VCS.
      JOTHECA_MIGRATE_PW: ${JOTHECA_MIGRATE_PW:-jotheca_migrate}
      JOTHECA_APP_PW: ${JOTHECA_APP_PW:-jotheca_app}
      JOTHECA_READALL_PW: ${JOTHECA_READALL_PW:-jotheca_readall}
    ports:
      - "5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/provision-roles.sh:/docker-entrypoint-initdb.d/10-provision-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jotheca"]
      interval: 5s
      retries: 20


  redis:
    image: redis:7-alpine
    ports:
      - "6479:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20


  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jotheca}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jotheca-secret-change-me}
    ports:
      - "9102:9000"
      - "9103:9001"
    volumes:
      - miniodata:/data


  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "9100:1025"
      - "9101:8025"


  chroma:
    image: chromadb/chroma:0.6.3
    environment:
      ANONYMIZED_TELEMETRY: "False"
    ports:
      - "8101:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    environment:
      CHROMA_URL: http://chroma:8000
      SBERT_MODEL: sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8100:8000"
    volumes:
      - sbert-cache:/root/.cache/torch/sentence_transformers
    depends_on:
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s


  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ai-service:
        condition: service_started
      chroma:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: staging

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jotheca}
      # Defaults preserve current behavior (single owner role). Restricted-role cutover (Phase A):
      # set APP_RUNTIME_DB_USER=jotheca_app + APP_RUNTIME_DB_PASSWORD=<secret> + APP_RESTRICTED_ROLE=true,
      # and merge the platform-plane routing (jotheca_readall) first. Flyway stays the owner/migration role.
      SPRING_DATASOURCE_USERNAME: ${APP_RUNTIME_DB_USER:-${POSTGRES_USER:-jotheca}}
      SPRING_DATASOURCE_PASSWORD: ${APP_RUNTIME_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      SPRING_FLYWAY_USERNAME: ${APP_FLYWAY_DB_USER:-${POSTGRES_USER:-jotheca}}
      SPRING_FLYWAY_PASSWORD: ${APP_FLYWAY_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      APP_RESTRICTED_ROLE: ${APP_RESTRICTED_ROLE:-false}
      APP_RATE_LIMIT_TRUSTED_PROXIES: ${APP_RATE_LIMIT_TRUSTED_PROXIES:-}
      # Platform-plane READ pool (used only when APP_RESTRICTED_ROLE=true). Secrets from .env; dev defaults only.
      APP_PLATFORM_READ_DB_USER: ${APP_PLATFORM_READ_DB_USER:-jotheca_readall}
      APP_PLATFORM_READ_DB_PASSWORD: ${APP_PLATFORM_READ_DB_PASSWORD:-${JOTHECA_READALL_PW:-jotheca_readall}}

      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}

      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

      SPRING_DATA_REDIS_HOST: redis

      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-jotheca-media}

      MAIL_HOST: mailpit
      MAIL_PORT: 1025

      AI_SERVICE_URL: http://ai-service:8000
      CHROMA_URL: http://chroma:8000

    ports:
      - "8180:8080"


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://backend:8080
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:
  pgdata:
    name: jotheca-complete_pgdata

  redisdata:
    name: jotheca-complete_redisdata

  miniodata:
    name: jotheca-complete_miniodata

  chromadata:
    name: jotheca-complete_chromadata

  sbert-cache:
    name: jotheca-complete_sbert-cache