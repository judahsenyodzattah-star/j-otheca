<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LibraNet — demo client</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --indigo:#4F46E5; --indigo-d:#3730A3; --bg:#F8FAFC; --card:#FFFFFF; --ink:#0F172A;
          --mut:#64748B; --line:#E2E8F0; --green:#15803D; --red:#B91C1C; --amber:#B45309; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--ink); }
  .bar { background:var(--indigo); color:#fff; padding:14px 20px; display:flex; gap:14px;
         align-items:center; position:sticky; top:0; z-index:5; box-shadow:0 2px 8px #0002; }
  .bar b { font-size:18px; letter-spacing:.3px; }
  .bar .who { margin-left:auto; font-size:13px; opacity:.92; display:flex; gap:10px; align-items:center; }
  .libpill { background:#ffffff26; border:1px solid #ffffff44; padding:4px 10px; border-radius:99px; font-size:12px; }
  nav.tabs { display:flex; gap:6px; padding:10px 20px 0; max-width:1080px; margin:auto; flex-wrap:wrap; }
  nav.tabs button { border:1px solid var(--line); background:#fff; padding:9px 16px; border-radius:99px;
                    cursor:pointer; font-size:14px; color:var(--mut); }
  nav.tabs button.on { background:var(--indigo); border-color:var(--indigo); color:#fff; }
  nav.tabs button.staff { border-color:#C7D2FE; }
  nav.tabs button.staff.on { background:var(--indigo-d); border-color:var(--indigo-d); }
  main { max-width:1080px; margin:14px auto 60px; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px;
          margin-bottom:14px; box-shadow:0 1px 2px #0001; }
  h2 { margin:2px 0 4px; font-size:19px; } h3 { margin:14px 0 6px; font-size:15px; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 12px; }
  input[type=text], input[type=password], input[type=email], input[type=number], textarea {
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; background:#fff; font-family:inherit; }
  input:focus, textarea:focus, select:focus { outline:2px solid #4F46E533; border-color:var(--indigo); }
  button.b { background:var(--indigo); color:#fff; border:none; padding:11px 18px; border-radius:10px;
             cursor:pointer; font-size:14px; font-weight:600; }
  button.b:hover { background:var(--indigo-d); }
  button.o { background:#fff; color:var(--indigo); border:1px solid var(--indigo); padding:10px 16px;
             border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; }
  button.danger { background:#fff; color:var(--red); border:1px solid #FCA5A5; }
  button.mini { background:#EEF2FF; color:var(--indigo-d); border:none; padding:7px 12px;
                border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600; }
  button.mini.red { background:#FEE2E2; color:var(--red); }
  button.mini.green { background:#DCFCE7; color:var(--green); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:0 0 auto; }
  .grow { flex:1 1 auto; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .form2 { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
  .form2 .full { grid-column:1/-1; }
  label.f { font-size:12px; color:var(--mut); display:block; margin-bottom:4px; }
  .chip { display:inline-block; background:#EEF2FF; color:var(--indigo-d); border-radius:99px;
          padding:2px 10px; font-size:12px; margin:2px 4px 2px 0; }
  .chip.gray { background:#F1F5F9; color:var(--mut); }
  .chip.green { background:#DCFCE7; color:var(--green); }
  .chip.red { background:#FEE2E2; color:var(--red); }
  .chip.amber { background:#FEF3C7; color:var(--amber); }
  table.t { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.t th { text-align:left; color:var(--mut); font-weight:600; font-size:12px; padding:6px 8px;
               border-bottom:2px solid var(--line); }
  table.t td { padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tr { display:flex; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); align-items:flex-start; }
  .tr:last-child { border-bottom:none; }
  .tr .t { font-weight:600; font-size:14.5px; } .tr .s { color:var(--mut); font-size:12.5px; margin-top:2px; }
  .avail { font-size:12.5px; font-weight:700; white-space:nowrap; }
  .ok { color:var(--green); } .no { color:var(--red); }
  .score { font-size:12px; color:var(--mut); white-space:nowrap; }
  .why { font-size:12.5px; color:var(--mut); margin-top:6px; }
  .why div::before { content:"— "; }
  .qrbox { display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; }
  .qrbox .num { font-size:22px; font-weight:700; letter-spacing:1px; }
  #qr img, #qr canvas { border:6px solid #fff; border-radius:8px; box-shadow:0 1px 4px #0002; }
  .note { background:#FFFBEB; border:1px solid #FDE68A; color:#92400E; font-size:13px;
          border-radius:10px; padding:10px 12px; }
  .flashok { background:#ECFDF5; border:1px solid #A7F3D0; color:#065F46; font-size:13px;
             border-radius:10px; padding:10px 12px; }
  .err { color:var(--red); font-size:13px; margin-top:8px; }
  .hidden { display:none !important; }
  select { padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff; }
  .kpi { display:flex; gap:14px; flex-wrap:wrap; }
  .kpi .k { background:#F8FAFC; border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .kpi .k b { font-size:18px; display:block; }
  .rolebadge { background:#FEF3C7; color:#92400E; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; }
</style>
</head>
<body>
<header class="bar">
  <b>📚 LibraNet</b> <span style="opacity:.75;font-size:13px">demo web mirror — all roles</span>
  <div class="who">
    <span id="whoRole" class="rolebadge hidden"></span>
    <span id="whoName" class="hidden"></span>
    <span id="whoLib" class="libpill hidden"></span>
    <button id="btnOut" class="mini hidden" onclick="signOut()">Sign out</button>
  </div>
</header>

<section id="login" class="card" style="max-width:520px;margin:48px auto">
  <h2>Sign in</h2>
  <p class="sub">Every role below opens a <b>different console</b> — that's the point of this demo.</p>
  <div id="acctBtns" class="row" style="margin-bottom:12px"></div>
  <label class="sub" for="email">Email</label>
  <input id="email" type="email" autocomplete="username">
  <div style="height:8px"></div>
  <label class="sub" for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <div style="height:14px"></div>
  <button class="b" onclick="doLogin()">Sign in</button>
  <div id="loginErr" class="err"></div>
</section>

<div id="app" class="hidden">
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
</div>

<script>
const presets = [
  {label:'👤 Patron — Accra Central', email:'patron@libranet.app', pw:'Patron12345!'},
  {label:'🛠 Librarian — Pentecost Univ.', email:'staff@libranet.app', pw:'Library12345!'},
  {label:'🧭 Library admin — Accra', email:'accraadmin@libranet.app', pw:'Library12345!'},
  {label:'🧭 Library admin — Pentecost', email:'libadmin@libranet.app', pw:'Library12345!'},
  {label:'✍️ Personal author', email:'author@libranet.app', pw:'Author12345!'},
  {label:'🏛 Platform super admin', email:'admin@libranet.app', pw:'Admin12345!'},
];
document.getElementById('acctBtns').innerHTML =
  presets.map((p,i)=>`<button class="mini" onclick="preset(${i})">${p.label}</button>`).join('');

const S = { token:null, me:null, memberships:[], uid:null, tab:null };

function preset(i){ email.value = presets[i].email; pw.value = presets[i].pw; }

function signOut(){
  S.token=null; S.me=null; S.memberships=[]; S.uid=null; S.tab=null;
  app.classList.add('hidden'); login.classList.remove('hidden');
  whoName.classList.add('hidden'); whoLib.classList.add('hidden');
  btnOut.classList.add('hidden'); whoRole.classList.add('hidden');
}

async function doLogin(){
  loginErr.textContent = '';
  try {
    const r = await fetch('/api/v1/auth/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: email.value.trim(), password: pw.value})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.message || ('HTTP '+r.status));
    S.token = j.accessToken;
    S.me = await api('/api/v1/me', {}, true).catch(()=>null);
    const m = await api('/api/v1/me/memberships', {}, true).catch(()=>[]);
    S.memberships = (Array.isArray(m) ? m : (m.content||[])).filter(x => x.status==='APPROVED');
    if(S.memberships.length) S.uid = S.memberships[0].libraryUid;

    whoName.textContent = (S.me?.fullName || email.value) + ' · ' + email.value;
    whoName.classList.remove('hidden');
    const role = S.me?.globalRole === 'SUPER_ADMIN' ? 'SUPER_ADMIN' : (active()?.role || S.me?.globalRole || 'USER');
    whoRole.textContent = pretty(role); whoRole.classList.remove('hidden');
    btnOut.classList.remove('hidden');
    login.classList.add('hidden'); app.classList.remove('hidden');
    buildTabs();
  } catch(e){ loginErr.textContent = e.message; }
}

function active(){ return S.memberships.find(m=>m.libraryUid===S.uid); }
function isSuperAdmin(){ return S.me?.globalRole === 'SUPER_ADMIN'; }
function isStaff(){ const r = active()?.role; return r==='LIBRARY_ADMIN' || r==='LIBRARIAN'; }
function isLibAdmin(){ return active()?.role === 'LIBRARY_ADMIN'; }

const RENDERERS = { home:renderHome, discover:renderDiscover, catalog:renderCatalog, mybooks:renderMyBooks,
                    ai:renderAi, desk:renderDesk, manage:renderManage, platform:renderPlatform,
                    support:renderSupport, author:renderAuthor };

function buildTabs(){
  let tabs;
  if (isSuperAdmin() && !S.memberships.length) {
    tabs = [['platform','🏛 Platform console']];          // SUPER_ADMIN never does library ops (by design)
  } else if (S.memberships.length) {
    tabs = [['home','Home'],['discover','Discover'],['catalog','Catalog'],['mybooks','My books'],['ai','✨ AI discovery']];
    tabs.push(['support','🛟 Support']);                 // audit P2: every member gets the lane
    tabs.push(['author','✍️ Author']);                   // audit P3: capability on the same account
    if (isStaff())    tabs.push(['desk','🛠 Circulation desk']);
    if (isLibAdmin()) tabs.push(['manage','🧭 Manage library']);
    if (isSuperAdmin()) tabs.push(['platform','🏛 Platform']);
  } else {
    tabs = [['discover','Discover']];                     // brand-new account: go join something
  }
  tabs._cur = tabs[0][0];
  document.getElementById('tabs').innerHTML = tabs.map(([k,l]) =>
    `<button id="tab-${k}" class="${k==='desk'||k==='manage'||k==='platform'?'staff':''}" onclick="show('${k}')">${l}</button>`).join('');
  show(tabs[0][0]);
}

async function api(path, opts={}, noTenant){
  opts.headers = Object.assign({'Authorization':'Bearer '+S.token}, opts.headers||{});
  if(!noTenant && S.uid) opts.headers['X-Library-Id'] = S.uid;
  const r = await fetch(path, opts); const j = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.message || ('HTTP '+r.status)), {code:j.code});
  return j;
}
function show(t){ S.tab=t; document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+t)?.classList.add('on');
  RENDERERS[t](); }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const el = id => document.getElementById(id);   // hyphenated ids are NOT reachable as bare globals
function pretty(s){ return String(s||'').toLowerCase().split('_').map(w=>w[0]?.toUpperCase()+w.slice(1)).join(' '); }
function when(x){ return x ? String(x).replace('T',' ').slice(0,16) : '—'; }
function money(minor){ return minor==null ? '—' : 'GH₵ '+(minor/100).toFixed(2); }
function statusChip(s){ const c = s==='ACTIVE'||s==='APPROVED'?'green' : s==='PENDING'?'amber' : s==='RETURNED'?'gray' : s==='SUSPENDED'||s==='REJECTED'||s==='OVERDUE'?'red' : 'gray';
  return `<span class="chip ${c}">${pretty(s)}</span>`; }

/* ------------------------------ patron surfaces ------------------------------ */

async function renderHome(){
  whoLib.textContent = active()?.libraryName || S.uid; whoLib.classList.remove('hidden');
  const a = active();
  const qrcard = a ? `<div class="card qrbox">
      <h3>Membership card</h3>
      <div id="qr"></div>
      <div class="num">${esc(a.membershipNumber||'')}</div>
      <div class="sub">${esc(a.libraryName||'')} · ${pretty(a.role)}</div>
      <div class="row"><button class="b" onclick="show('catalog')">Browse catalog</button>
      <button class="o" onclick="show('mybooks')">My books</button></div></div>` : '';
  view.innerHTML = `<h2>Your libraries</h2>
    <p class="sub">Global identity — one account, per-library memberships and roles.</p>
    <div class="grid">${S.memberships.map(m=>`
      <div class="card" style="cursor:pointer;${m.libraryUid===S.uid?'outline:2px solid var(--indigo)':''}"
           onclick="S.uid='${m.libraryUid}'; whoRole.textContent=pretty(active()?.role||''); buildTabs()">
        <b>${esc(m.libraryName||m.libraryUid)}</b>
        <div class="sub">${pretty(m.role)} · ${pretty(m.membershipType)} · ${esc(m.libraryUid)}</div>
        ${m.libraryUid===S.uid?'<span class="chip green">active</span>':'<span class="chip gray">tap to switch</span>'}
      </div>`).join('')}</div>${qrcard}`;
  if (a){ const d = a.membershipNumber || a.membershipId;
    try { new QRCode(document.getElementById('qr'), {text:d, width:150, height:150}); }
    catch(e){ document.getElementById('qr').innerHTML = `<span class="num">${esc(d)}</span>`; } }
}

async function renderDiscover(){
  view.innerHTML = `<h2>Discover libraries</h2><p class="sub">Public directory — request membership with an invite code.</p>
    <div class="row" style="margin-bottom:14px"><input class="grow" id="dq" type="text"
      placeholder="Search by name or description…" onkeydown="if(event.key==='Enter')renderDiscover()">
      <button class="b" onclick="renderDiscover()">Search</button></div><div id="dres"></div>`;
  const q = dq.value?.trim();
  try {
    const p = await api('/api/v1/libraries' + (q?('?search='+encodeURIComponent(q)):''), {}, true);
    dres.innerHTML = `<div class="grid">${(p.content||[]).map(l=>`<div class="card">
      <b>${esc(l.name)}</b> <span class="chip">${esc(l.type)}</span>
      <div class="sub">${esc([l.city,l.country].filter(Boolean).join(', '))} · ${l.memberCount} members · join: ${pretty(l.joinPolicy)}</div>
      ${l.description?`<div class="sub">${esc(l.description)}</div>`:''}
      <div class="row" style="margin-top:8px"><input id="jc-${esc(l.slug||l.librarySlug||'')}" type="text"
        placeholder="invite code (try ASH-2026)" style="width:170px;padding:8px 10px">
        <button class="mini green" onclick="joinLib('${esc(l.slug||l.librarySlug||'')}')">Request to join</button></div>
      </div>`).join('')||'<p class="sub">No matches.</p>'}</div>`;
  } catch(e){ dres.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
async function joinLib(slug){
  const code = document.getElementById('jc-'+slug).value.trim();
  if(!code) return alert('Enter the invite code first (seeded: ASH-2026 for Ashesi).');
  try {
    await api(`/api/v1/libraries/${encodeURIComponent(slug)}/join`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({inviteCode: code})}, true);
    alert('Membership requested — check back once a librarian approves you (or see it live in the Manage tab of that library admin).');
  } catch(e){ alert(e.message + (e.code?` [${e.code}]`:'')); }
}

async function renderCatalog(){
  view.innerHTML = `<h2>Catalog</h2><p class="sub">Tenant-scoped search — served only from the active library.</p>
    <div class="row" style="margin-bottom:14px"><input class="grow" id="cq" type="text"
      placeholder="Title, author, subject or ISBN… (try a typo!)" onkeydown="if(event.key==='Enter')renderCatalog()">
      <button class="b" onclick="renderCatalog()">Search</button></div><div id="cres" class="card"></div>`;
  try {
    const p = await api('/api/v1/tenant/catalog/books?size=40' + (cq.value?.trim()?('&q='+encodeURIComponent(cq.value.trim())):''));
    const rows = (p.content||[]);
    cres.innerHTML = rows.length ? rows.map(b=>`<div class="tr">
      <div class="grow"><div class="t">${esc(b.title)}</div>
      <div class="s">${esc(b.author||'')}${b.categoryName?' · '+esc(b.categoryName):''}${b.publishedYear?' · '+b.publishedYear:''}</div></div>
      <span class="avail ${b.availableCopies>0?'ok':'no'}">${b.availableCopies>0?b.availableCopies+' available':'out'}</span></div>`).join('')
      : '<p class="sub">No books match — staff see this as demand in AI insights.</p>';
  } catch(e){ cres.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function renderMyBooks(){
  view.innerHTML = `<h2>My books</h2><p class="sub">Loans in the active library — renewals follow the library's policy.</p><div id="myloans" class="card">Loading…</div>`;
  try {
    const p = await api('/api/v1/tenant/circulation/loans/me');
    const rows = p.content||[];
    myloans.innerHTML = rows.length ? `<table class="t"><tr><th>Book</th><th>Issued</th><th>Due</th><th>Status</th><th></th></tr>` +
      rows.map(l=>`<tr><td><b>${esc(l.bookTitle||'')}</b><br><span class="sub">${esc(l.barcode||'')}</span></td>
        <td>${when(l.issuedAt)}</td><td>${when(l.dueAt)}</td>
        <td>${statusChip(l.status)} ${l.overdue?statusChip('OVERDUE'):''}</td>
        <td>${l.status==='ACTIVE'?`<button class="mini" onclick="renew('${l.id}')">Renew</button>`:''}</td></tr>`).join('') + `</table>`
      : '<p class="sub">Nothing borrowed yet — the circulation desk issues loans against your membership QR.</p>';
  } catch(e){ myloans.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
async function renew(id){ try { await api(`/api/v1/tenant/circulation/loans/${id}/renew`, {method:'POST'}); renderMyBooks(); }
  catch(e){ alert(e.message + (e.code?` [${e.code}]`:'')); } }

/* ------------------------------ staff: circulation desk ------------------------------ */

async function renderDesk(){
  view.innerHTML = `<h2>🛠 Circulation desk</h2>
    <p class="sub">Issue and return against a membership number (QR) + copy barcode. Errors are policy violations, shown raw.</p>
    <div class="grid">
      <div class="card"><h3>Checkout</h3>
        <label class="f">Membership number (patron's QR)</label><input id="ck-mno" type="text" placeholder="e.g. M-…">
        <div style="height:8px"></div>
        <label class="f">Copy barcode</label><input id="ck-bar" type="text" placeholder="scan or type">
        <div style="height:12px"></div><button class="b" onclick="checkout()">Issue loan</button>
        <div id="ck-res"></div></div>
      <div class="card"><h3>Return</h3>
        <label class="f">Copy barcode</label><input id="rt-bar" type="text" placeholder="scan or type">
        <div style="height:12px"></div><button class="b" onclick="retcopy()">Return by barcode</button>
        <div id="rt-res" style="margin-top:8px"></div>
        <p class="sub" style="margin-top:10px">…or use the Return button on a row below.</p></div>
    </div>
    <div class="card"><h3>Open & recent loans — ${esc(active()?.libraryName||'')}</h3><div id="loans">Loading…</div></div>`;
  loadLoans();
}
async function loadLoans(){
  try {
    const p = await api('/api/v1/tenant/circulation/loans?size=50');
    const rows = p.content||[];
    loans.innerHTML = rows.length ? `<table class="t"><tr><th>Borrower</th><th>Book</th><th>Due</th><th>Status</th><th></th></tr>` +
      rows.map(l=>`<tr><td><b>${esc(l.borrowerName||'')}</b><br><span class="sub">${esc(l.membershipNumber||'')}</span></td>
        <td>${esc(l.bookTitle||'')}<br><span class="sub">${esc(l.barcode||'')}</span></td>
        <td>${when(l.dueAt)}</td>
        <td>${statusChip(l.status)} ${l.overdue?statusChip('OVERDUE'):''}${l.renewedCount?`<span class="chip gray">↻${l.renewedCount}</span>`:''}</td>
        <td>${l.status==='ACTIVE'?`<button class="mini green" onclick="retloan('${l.id}')">Return</button>
          <button class="mini" onclick="renewloan('${l.id}')">Renew</button>`:''}</td></tr>`).join('') + `</table>`
      : '<p class="sub">No loans yet — issue one above.</p>';
  } catch(e){ loans.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
async function checkout(){
  ck_res.innerHTML=''; try {
    const l = await api('/api/v1/tenant/circulation/loans', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({membershipNumber: el('ck-mno').value.trim(), barcode: el('ck-bar').value.trim()})});
    ck_res.innerHTML = `<div class="flashok" style="margin-top:10px">✅ Issued “${esc(l.bookTitle)}” to ${esc(l.borrowerName)} — due ${when(l.dueAt)}</div>`;
    loadLoans();
  } catch(e){ ck_res.innerHTML = `<p class="err">⛔ ${esc(e.message)}${e.code?` <span class="chip red">${esc(e.code)}</span>`:''}</p>`; }
}
async function retcopy(){
  rt_res.innerHTML=''; try {
    const l = await api('/api/v1/tenant/circulation/returns', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({barcode: el('rt-bar').value.trim()})});
    rt_res.innerHTML = `<div class="flashok">✅ “${esc(l.bookTitle)}” returned — ${pretty(l.status)}</div>`;
    loadLoans();
  } catch(e){ rt_res.innerHTML = `<p class="err">⛔ ${esc(e.message)}${e.code?` <span class="chip red">${esc(e.code)}</span>`:''}</p>`; }
}

async function loadStaffPerms(){
  try {
    const cat = await api('/api/v1/tenant/permissions/catalog');
    const p = await api('/api/v1/tenant/members?status=APPROVED&size=50');
    const staff = (p.content||[]).filter(m=>m.role==='LIBRARIAN');
    if(!staff.length){ staffperms.innerHTML = '<p class="sub">No librarians yet — promote an approved member from the table above.</p>'; return; }
    const rows = [];
    for(const m of staff){
      const v = await api(`/api/v1/tenant/permissions/staff/${m.id}`);
      rows.push(`<tr><td><b>${esc(m.fullName||'')}</b><br><span class="sub">${esc(m.email||'')}</span></td>
        <td>${cat.map(c=>{const on=(v.effective||[]).includes(c.key);const ov=(v.overrides||[]).find(o=>o.perm===c.key);
          return `<label class="sub" style="display:inline-flex;gap:3px;align-items:center;margin:2px 8px 2px 0">
            <input type="checkbox" data-mid="${m.id}" data-perm="${c.key}" ${on?'checked':''} onchange="permDirty=true">
            ${esc(c.label)}${ov?'<b title="overridden" style="color:#e07b00">*</b>':''}</label>`;}).join('')}</td>
        <td><button class="mini green" onclick="savePerms('${m.id}')">Save</button></td></tr>`);
    }
    staffperms.innerHTML = `<table class="t"><tr><th>Librarian</th><th>Effective permissions (* = overridden)</th><th></th></tr>${rows.join('')}</table>
      <p class="sub">Saving stores one override row per deviation from the librarian default; everything else resets.</p>`;
  } catch(e){ staffperms.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
async function savePerms(mid){
  try {
    const cat = await api('/api/v1/tenant/permissions/catalog');
    const boxes = document.querySelectorAll(`input[data-mid="${mid}"]`);
    const overrides = [...boxes].map(b=>{
      const def = cat.find(c=>c.key===b.dataset.perm);
      return {perm: b.dataset.perm, granted: (b.checked === !!(def&&def.librarianDefault)) ? null : b.checked};
    });
    await api(`/api/v1/tenant/permissions/staff/${mid}`, {method:'PUT',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({overrides})});
    loadStaffPerms();
  } catch(e){ alert(e.message + (e.code?` [${e.code}]`:'')); }
}

async function issueClientKey(){ return 'web-'+Date.now()+'-'+Math.random().toString(36).slice(2,8); }

async function draftIssue(){
  const desc = el('supDesc').value.trim();
  el('supErr').textContent = '';
  if (desc.length < 10){ el('supErr').textContent = 'Describe what happened first (10+ characters).'; return; }
  try {
    // spec §20: the assistant DRAFTS — the member reviews and only then we POST with source=AI.
    const d = await api('/api/v1/tenant/ai/issues/draft', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({description: desc})});
    el('supCat').value = d.category;
    el('supSubj').value = d.subject;
    el('supDesc').value = d.description;                       // echoed verbatim — never fabricated
    el('supErr').style.color = 'var(--green)';
    el('supErr').textContent = 'Drafted from your words — review the category + summary, then press Send.';
  } catch(e){ el('supErr').textContent = e.message; }
}

async function submitIssue(source){
  const body = {category: el('supCat').value, subject: el('supSubj').value.trim(),
                description: el('supDesc').value.trim(), clientKey: await issueClientKey()};
  if (source === 'AI') body.source = 'AI';
  el('supErr').style.color = 'var(--red)'; el('supErr').textContent = '';
  if (!body.subject || body.description.length < 10){
    el('supErr').textContent = 'Give a summary and 10+ characters of detail.'; return; }
  try {
    const issue = await api('/api/v1/tenant/issues', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    el('supSubj').value=''; el('supDesc').value='';
    await loadMine();
    el('supErr').style.color='var(--green)';
    el('supErr').textContent = 'Filed as '+issue.ref+' — the library team has it.';
  } catch(e){ el('supErr').textContent = e.message; }
}

async function loadThread(id, ref, staff){

  const msgs = (d.messages||[]).map(m => `

      <div>${esc(m.body)}</div>
    </div><div class="s">${when(m.createdAt)}</div></div>`).join('');
  const staffBar = staff ? `<div class="row" style="margin:10px 0">
      <button class="mini" onclick="issueAct('${id}','assign',{assigneeMembershipId:'me'})">Assign to me</button>
      <button class="mini" onclick="issueActPrompt('${id}','request-info','Ask the member for what? (sent to them)')">Request info</button>
      <button class="mini green" onclick="issueActPrompt('${id}','resolve','Resolution the member will see?')">Resolve</button>
      <button class="mini red" onclick="issueActPrompt('${id}','escalate','Why escalate? (staff-only note)')">Escalate</button>
      <button class="mini" onclick="issueAct('${id}','reopen')">Reopen</button>
      <select id="supPrio" onchange="issueAct('${id}','priority',{priority:this.value})">
        ${['LOW','NORMAL','HIGH','URGENT'].map(p=>`<option ${d.issue.priority===p?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <label class="f"><input type="checkbox" id="supInternal" style="width:auto"> internal note (staff only)</label>` : '';
  const target = staff ? el('supDetail') : el('view');
  const html = `<div class="card">
    <h2>${esc(ref)} — ${esc(d.issue.subject)}</h2>
    <p class="sub">${issueChip(d.issue.status)} ${esc(pretty(d.issue.category))}
      · opened ${when(d.issue.createdAt)}${d.issue.resolvedAt?' · resolved '+when(d.issue.resolvedAt):''}</p>
    <div class="note">${esc(d.description)}</div>
    ${msgs || '<p class="sub" style="margin-top:8px">No messages yet.</p>'}
    ${staffBar}
    <div class="row" style="margin-top:10px">
      <input type="text" class="grow" id="supReply" maxlength="10000" placeholder="Write a reply…">
      <button class="b" onclick="sendIssueReply('${id}','${ref}',${staff})">Send</button>
    </div>
    ${staff?'':'<div class="row" style="margin-top:8px"><button class="o" onclick="show(\'support\')">← Back to my issues</button></div>'}
  </div>`;
  if (staff) target.innerHTML = html; else target.innerHTML = supportPatronShell() + html;
}

async function sendIssueReply(id, ref, staff){
  const body = {body: el('supReply').value.trim()};
  if (!body.body) return;
  if (staff && el('supInternal')?.checked) body.internal = true;
  try { await api('/api/v1/tenant/issues/'+id+'/messages', {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    await loadThread(id, ref, staff); }
  catch(e){ alert(e.message); }
}

async function issueAct(id, action, body){
  try { await api(`/api/v1/tenant/issues/${id}/${action}`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
    await loadInbox(); el('supDetail').innerHTML=''; }
  catch(e){ alert(e.message); }
}
async function issueActPrompt(id, action, hint){

  await issueAct(id, action, {note});

  v.innerHTML = `<div class="card">
    <h2>✍️ ${esc(p.penName)}</h2>
    <p class="sub">${p.publicProfile ? `Public page live at <code>/app/authors/${esc(p.slug)}</code> — anon API: <code>/api/v1/public/authors/${esc(p.slug)}</code>`
        : 'Public page is off — only you can see this.'}</p>
    <div>${links}</div>
    <p class="sub" style="margin-top:6px">${esc(p.bio || '')}</p>
    <div class="form2" style="margin-top:8px">
      <div><label class="f">Pen name</label><input type="text" id="apPen" value="${esc(p.penName)}"></div>
      <div><label class="f">Country</label><input type="text" id="apCountry" value="${esc(p.country||'')}"></div>
      <div class="full"><label class="f">Bio</label><textarea id="apBio" rows="3" maxlength="2000">${esc(p.bio||'')}</textarea></div>
      <div><label class="f">Languages (CSV)</label><input type="text" id="apLang" value="${esc((p.languages||[]).join(', '))}"></div>
      <div><label class="f">Genres (CSV)</label><input type="text" id="apGenres" value="${esc((p.genres||[]).join(', '))}"></div>
      <div><label class="f">Public contact email (optional)</label><input type="text" id="apEmail" value="${esc(p.publicEmail||'')}"></div>
      <div><label class="f">Photo URL</label><input type="text" id="apPhoto" value="${esc(p.photoUrl||'')}"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="f" style="margin:0"><input type="checkbox" id="apPublic" ${p.publicProfile?'checked':''} style="width:auto"> publish my public page</label>
      <button class="b" onclick="authorSave()">Save profile</button>
      <span id="apErr" class="err"></span>
    </div>
  </div>
  <div class="card">
    <h3>Studio</h3>
    <div class="kpi">
      <div class="k"><b>${t.books??0}</b>books</div>
      <div class="k"><b>${t.interested??0}</b>interested</div>
      <div class="k"><b>${t.pendingRequests??0}</b>pending sales</div>
      <div class="k"><b>${t.copiesSold??0}</b>copies sold</div>
      <div class="k"><b>${money(t.revenueMinor)}</b>revenue</div>
      <div class="k"><b>${t.ratings??0}</b>ratings</div>
    </div>
    ${(studio?.books||[]).map(b=>`<div class="tr"><div class="grow">
        <div class="t">${esc(b.title)}</div>
        <div class="s">at ${esc(b.libraryName||'')} · ♥ ${b.interestedCount} · ${b.pendingRequests} pending ·
          ${b.copiesSold} sold${b.ratingCount?` · ★ ${Number(b.ratingAvg).toFixed(1)} (${b.ratingCount})`:''}</div>
      </div><div class="score">${b.salePriceMinor!=null?money(b.salePriceMinor):''}</div></div>`).join('')}
  </div>
  <div class="card">
    <h3>Direct selling</h3>
    <p class="sub">${p.sellingEnabled
        ? `On — payouts to ${esc(p.payoutMomoNetwork||'MoMo')} ${esc(p.payoutMomoMasked||'')}.`
        : 'Off. MoMo payout details are collected only when you activate — never at registration.'}</p>
    ${p.sellingEnabled
        ? `<button class="o" onclick="authorSelling(false)">Pause selling</button>`
        : `<div class="row"><input type="text" id="apMomo" placeholder="MoMo number (024…)" style="max-width:220px">
             <select id="apNet"><option>MTN</option><option>TELECEL</option><option>AIRTELTIGO</option></select>
             <button class="b" onclick="authorSelling(true)">Activate selling</button>
             <span class="err" id="apSellErr"></span></div>`}
  </div>`;
}

async function authorCreate(){
  const pen = el('apPen').value.trim();
  try {
    await api('/api/v1/me/author-profile', {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({penName: pen})}, true);
    renderAuthor();
  } catch(e){ el('apErr').textContent = e.message; }
}

async function authorSave(){
  try {
    await api('/api/v1/me/author-profile', {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({penName: el('apPen').value.trim(), bio: el('apBio').value.trim(),
        country: el('apCountry').value.trim(), languages: el('apLang').value.trim(),
        genres: el('apGenres').value.trim(), photoUrl: el('apPhoto').value.trim(),
        publicEmail: el('apEmail').value.trim(), publicProfile: el('apPublic').checked})}, true);
    renderAuthor();
  } catch(e){ el('apErr').textContent = e.message; }
}

async function authorSelling(on){
  if (!on) { await api('/api/v1/me/author-profile/deactivate-selling', {method:'POST'}, true); renderAuthor(); return; }
  try {
    await api('/api/v1/me/author-profile/activate-selling', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({momoNumber: el('apMomo').value.trim(), momoNetwork: el('apNet').value})}, true);
    renderAuthor();
  } catch(e){ el('apSellErr').textContent = e.message; }
}

async function renderPlatform(){
  whoLib.classList.add('hidden');
  view.innerHTML = `<h2>🏛 Platform console</h2>
    <p class="sub">SUPER_ADMIN — sees the whole network, touches no tenant's books or loans by design.</p>
    <div class="card"><h3>📊 Network stats</h3><div id="pstats" class="kpi">Loading…</div></div>
    <div class="card"><h3>📝 Library onboarding requests</h3><div id="ponb">Loading…</div></div>
    <div class="card"><h3>🏛 Libraries on the network</h3>
      <div class="row"><select id="plibstat" onchange="loadLibs()">
        <option value="">All</option><option value="PENDING">Pending</option>
        <option value="ACTIVE">Active</option><option value="SUSPENDED">Suspended</option></select></div>
      <div id="plibs" style="margin-top:8px">Loading…</div></div>
    <div class="card"><h3>💳 Payments (all tenants)</h3><div id="ppay">Loading…</div></div>`;
  loadStats(); loadOnb(); loadLibs(); loadPay();
}
async function loadStats(){ try { const d = await api('/api/v1/platform/stats', {}, true);
  pstats.innerHTML = Object.entries(d).filter(([,v])=>typeof v==='number').map(([k,v])=>
    `<div class="k"><span class="sub">${pretty(k)}</span><b>${v.toLocaleString()}</b></div>`).join('') || '<span class="sub">No counters.</span>';
  } catch(e){ pstats.innerHTML = `<span class="err">${esc(e.message)}</span>`; } }
async function loadOnb(){ try {
  const p = await api('/api/v1/platform/onboarding?status=SUBMITTED&size=50', {}, true);
  const rows = p.content||[];
  ponb.innerHTML = rows.length ? `<table class="t"><tr><th>Library</th><th>Type</th><th>Plan</th><th>Requested</th><th></th></tr>` +
    rows.map(o=>`<tr><td><b>${esc(o.libraryName||'')}</b><br><span class="sub">${esc([o.city,o.country].filter(Boolean).join(', '))}</span></td>
      <td>${pretty(o.type||'')}</td><td>${esc(o.planCode||'')}</td><td>${when(o.createdAt)}</td>
      <td class="row"><button class="mini green" onclick="onb('${o.id}','approve')">Approve</button>
        <button class="mini red" onclick="onb('${o.id}','reject')">Reject</button></td></tr>`).join('') + `</table>`
    : '<p class="sub">No pending requests — submit one from the public onboarding flow to see it land here.</p>';
  } catch(e){ ponb.innerHTML = `<p class="err">${esc(e.message)}</p>`; } }
async function onb(id, act){ let body;
  if(act==='reject'){ const reason = prompt('Rejection reason (goes to the applicant):'); if(reason==null) return;
    body = {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({reason})}; }
  else body = {method:'POST'};
  try { await api(`/api/v1/platform/onboarding/${id}/${act}`, body, true); loadOnb(); loadLibs(); loadStats(); }
  catch(e){ alert(e.message + (e.code?` [${e.code}]`:'')); } }
async function loadLibs(){
  try {
    let plans=[]; try { plans = await api('/api/v1/plans', {}, true); } catch(_){}
    const codes = (Array.isArray(plans)?plans:(plans.content||[])).map(p=>p.code||p.planCode).filter(Boolean);
    const p = await api('/api/v1/platform/libraries?size=100' + (plibstat.value?('&status='+plibstat.value):''), {}, true);
    const rows = p.content||[];
    plibs.innerHTML = rows.length ? `<table class="t"><tr><th>Library</th><th>Type</th><th>Status</th><th>Plan</th><th></th></tr>` +
      rows.map(l=>{ const id = l.id||l.libraryId; return `<tr><td><b>${esc(l.name)}</b><br>
        <span class="sub">${esc([l.city,l.country].filter(Boolean).join(', '))} · ${esc(l.libraryUid||'')}</span></td>
        <td>${pretty(l.type)}</td><td>${statusChip(l.status)}</td>
        <td class="row"><select id="plan-${id}">${codes.map(c=>`<option ${c===l.planCode?'selected':''}>${c}</option>`).join('')}</select>
          <button class="mini" onclick="chgPlan('${id}')">Set</button></td>
        <td class="row">${l.status==='ACTIVE'?`<button class="mini red" onclick="libAct('${id}','suspend')">Suspend</button>`
          :`<button class="mini green" onclick="libAct('${id}','approve')">Approve</button>`}</td></tr>`; }).join('') + `</table>`
      : '<p class="sub">No libraries match.</p>';
  } catch(e){ plibs.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
async function libAct(id, act){ try { await api(`/api/v1/platform/libraries/${id}/${act}`, {method:'POST'}, true);
  loadLibs(); loadStats(); } catch(e){ alert(e.message + (e.code?` [${e.code}]`:'')); } }
async function chgPlan(id){ const planCode = document.getElementById('plan-'+id).value;
  const reason = prompt('Reason for the plan change (audited):','demo') || 'demo';
  try { const r = await api(`/api/v1/platform/libraries/${id}/plan`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({planCode, reason})}, true);
    alert(`Plan ${r.fromPlan} → ${r.toPlan} (${r.direction})`); loadLibs();
  } catch(e){ alert(e.message + (e.code?`\n[${e.code}] — downgrades past current usage are refused`:'')); } }
async function loadPay(){ try {
  const p = await api('/api/v1/platform/payments?size=30', {}, true);
  const rows = p.content||[];
  ppay.innerHTML = rows.length ? `<table class="t"><tr><th>Reference</th><th>Library</th><th>Amount</th><th>Status</th><th>When</th></tr>` +
    rows.map(x=>`<tr><td>${esc(x.reference||'')}</td><td>${esc(x.libraryName||'')}</td>
      <td>${money(x.amountMinor)}</td><td>${statusChip(x.status)}</td><td>${when(x.createdAt)}</td></tr>`).join('') + `</table>`
    : '<p class="sub">No payments yet — subscribe a library to a paid plan to see Paystack minor-unit rows here.</p>';
  } catch(e){ ppay.innerHTML = `<p class="err">${esc(e.message)}</p>`; } }

/* ------------------------------ AI (unchanged patron/staff surface) ------------------------------ */

async function renderAi(){
  const staff = isStaff();
  view.innerHTML = `<h2>✨ AI discovery</h2>
    <p class="sub">Semantic ranking runs inside this library only — tenant-isolation layer 9.</p>
    <div id="usageChip"></div>
    <div class="card"><h3>Semantic search</h3>
      <p class="sub">Ask naturally — e.g. “beginner Java books after 2023”.</p>
      <div class="row"><input class="grow" id="aq" type="text"
        value="beginner Java books after 2023" onkeydown="if(event.key==='Enter')aiSearch()">
        <button class="b" onclick="aiSearch()">Search</button></div>
      <div id="ares"></div></div>
    <div class="card"><h3>For you</h3><p class="sub">From your loans, ratings and want-it marks — never titles you already consumed.</p><div id="recs"></div></div>
    <div id="staffzone"></div>`;
  aiSearch(); loadRecs();
  if(staff){
    staffzone.innerHTML = `
    <div class="card"><h3>Ask the assistant (staff)</h3>
      <div class="row"><input class="grow" id="askq" type="text" value="what should we buy more copies of?"
        onkeydown="if(event.key==='Enter')ask()"><button class="b" onclick="ask()">Ask</button></div>
      <div id="askres"></div></div>
    <div class="card"><h3>Demand insights (staff)</h3><div id="dinsights"></div></div>`;
    loadUsage(); loadInsights();
  } else {
    staffzone.innerHTML = `<div class="note">Staff-only: the assistant, demand insights and the AI usage meter appear when the
      active membership is Librarian/Admin — sign in as the Pentecost librarian to see them.</div>`;
  }
}
async function loadUsage(){ try { const u = await api('/api/v1/tenant/ai/usage');
  usageChip.innerHTML = `<span class="chip amber">⚡ ${u.used} / ${u.limit} AI calls this month</span>`;
  } catch(e){} }
async function aiSearch(){ try {
  const r = await api('/api/v1/tenant/ai/search?q='+encodeURIComponent(aq.value.trim()));
  const f = r.filters||{}; const fc = f.publishedAfter?`published after ${f.publishedAfter}`:f.publishedBefore?`published before ${f.publishedBefore}`:f.publishedIn?`published in ${f.publishedIn}`:null;
  ares.innerHTML = (fc?`<span class="chip">⛳ filter: ${fc}</span><div style="height:6px"></div>`:'') +
    (r.hits||[]).map(h=>`<div class="tr"><div class="grow">
      <div class="t">${esc(h.title)}</div><div class="s">${esc(h.author)}${h.publishedYear?' · '+h.publishedYear:''}</div>
      <div>${(h.matchedTokens||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
      <div class="why">${(h.why||[]).map(w=>`<div>${esc(w)}</div>`).join('')}</div></div>
      <span class="score">${Math.round((h.score||0)*100)}% match</span></div>`).join('')
    || '<p class="sub">No semantic matches — recorded as uncatalogued demand.</p>';
  loadUsage();
  } catch(e){ ares.innerHTML = `<p class="err">${esc(e.message)}${e.code==='PLAN_LIMIT_EXCEEDED'?' (plan meter hit)':''}</p>`; } }
async function loadRecs(){ try { const r = await api('/api/v1/tenant/ai/recommendations');
  recs.innerHTML = (r.recommendations||[]).map(x=>`<div class="tr"><div class="grow">
    <div class="t">${esc(x.title)}</div><div class="s">${esc(x.author)}</div>
    <div class="why"><div>${(x.because||[]).map(esc).join(' · ')}</div></div></div>
    ${x.ratingCount?`<span class="score">★ ${x.ratingAvg.toFixed(1)}</span>`:''}</div>`).join('')
    || '<p class="sub">Borrow, rate or flag titles to build your profile.</p>';
  } catch(e){ recs.innerHTML = `<p class="err">${esc(e.message)}</p>`; } }
async function ask(){ askres.innerHTML='<p class="sub">Thinking…</p>'; try {
  const r = await api('/api/v1/tenant/ai/assistant/ask', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({question: askq.value.trim()})});
  askres.innerHTML = `<span class="chip">${pretty(r.intent)}</span>
    <p style="font-size:14px;margin:8px 0">${esc(r.answer)}</p>
    <div>${(r.citations||[]).map(c=>`<span class="chip gray">📖 ${esc(c.title)}</span>`).join('')}</div>
    <p class="sub" style="margin:8px 0 0">Audit keeps the intent and question length — never the question text.</p>`;
  loadUsage();
  } catch(e){ askres.innerHTML = `<p class="err">${esc(e.message)}</p>`; } }
async function loadInsights(){ try { const r = await api('/api/v1/tenant/ai/demand-insights');
  dinsights.innerHTML =
    (r.topDemanded||[]).map(d=>`<div class="tr"><div class="grow"><div class="t">${esc(d.title)}</div>
      <div class="s">${d.interests} want-it · ${d.waitingReservations} waiting<br>${esc(d.suggestion||'')}</div></div></div>`).join('') +
    ((r.uncataloguedDemand||[]).length ? `<h4 style="margin:10px 0 4px">Searched but not in the catalog</h4>` +
      r.uncataloguedDemand.map(z=>`<div class="tr"><div class="grow"><div class="t">${esc(z.query)}</div>
        <div class="s">${z.occurrences} searches<br>${esc(z.suggestion||'')}</div></div></div>`).join('') : '') +
    ((r.summary||[]).map(s=>`<div class="why"><div>${esc(s)}</div></div>`).join('')) ||
    '<p class="sub">No demand signals recorded this period.</p>';
  loadUsage();
  } catch(e){ dinsights.innerHTML = `<p class="err">${esc(e.message)}</p>`; } }
</script>
</body>
