name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + full test suite (incl. TenantIsolationTest — merge blocker)
        run: mvn -B verify

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release   # fails the merge on any compile error, not just analysis

  # Release-checklist prerequisite: every PG-only behavior (RLS policies, pgvector HNSW,
  # pg_trgm trigram indexes) must be proven against REAL Postgres on every change.
  staging-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: libranet
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: libranet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U libranet"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        working-directory: backend
        run: mvn -B -q -DskipTests package
      - name: Boot the staging profile against real Postgres + Redis
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: staging
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/libranet
          SPRING_DATASOURCE_USERNAME: libranet
          SPRING_DATASOURCE_PASSWORD: postgres
          APP_JWT_SECRET: ci-smoke-secret-ci-smoke-secret-ci-smoke-secret-ci01
          PUBLIC_BASE_URL: http://localhost:8080
          CORS_ORIGINS: http://localhost
          SWAGGER_ENABLED: "true"
          SPRING_DATA_REDIS_HOST: localhost
          STORAGE_PROVIDER: memory
        run: |
          nohup java -jar target/libranet-backend-*.jar > /tmp/app.log 2>&1 & echo $! > /tmp/app.pid
          for i in $(seq 1 60); do
            curl -sf localhost:8080/actuator/health && exit 0 || sleep 2
          done
          echo "app did not become healthy"; tail -50 /tmp/app.log; exit 1
      - name: HTTP smoke (web layer up on real stack)
        run: |
          curl -sf localhost:8080/actuator/health | grep -q UP
          curl -sf "localhost:8080/api/v1/libraries" | grep -q totalElements
          curl -sf localhost:8080/v3/api-docs | grep -q "LibraNet API"
          curl -sf -X POST localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@libranet.dev","password":"CiSmoke12345!","fullName":"CI Smoke"}'
      - name: PG-only migrations actually landed (RLS + HNSW + trigram + RLS enabled)
        run: |
          PG="docker exec -e PGPASSWORD=postgres $(docker ps -qf ancestor=pgvector/pgvector:pg16) psql -U libranet -d libranet -At"
          HNSW=$($PG -c "SELECT COUNT(*) FROM pg_indexes WHERE indexname = 'idx_book_embeddings_hnsw'")
          TRGM=$($PG -c "SELECT COUNT(*) FROM pg_indexes WHERE indexname LIKE '%_trgm'")
          RLS=$($PG -c "SELECT COUNT(*) FROM pg_policies WHERE policyname LIKE '%_tenant_isolation'")
          RLS_ON=$($PG -c "SELECT COUNT(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relrowsecurity")
          echo "hnsw=$HNSW trgm=$TRGM policies=$RLS rlsEnabled=$RLS_ON"
          [ "$HNSW" = "1" ] && [ "$TRGM" = "4" ] && [ "$RLS" -ge 25 ] && [ "$RLS_ON" -ge 25 ]
      - name: Teardown
        if: always()
        run: kill "$(cat /tmp/app.pid)" 2>/dev/null || true
